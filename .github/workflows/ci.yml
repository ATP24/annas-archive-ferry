name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax & compilation
        run: |
          python -m py_compile scripts/ferry_engine.py annas_archive_ferry/__init__.py annas_archive_ferry/config.py annas_archive_ferry/engine.py

      - name: Verify Full Module Imports (Catch Missing Dependencies)
        run: |
          python -c "import annas_archive_ferry; from bs4 import BeautifulSoup; import fitz; import ddddocr; import requests; print('All core modules imported successfully')"

      - name: Test CLI Interface & Subcommands
        run: |
          python scripts/ferry_engine.py --help
          python scripts/ferry_engine.py search --help
          python scripts/ferry_engine.py probe --help
          python scripts/ferry_engine.py download --help

      - name: Test Standard Package Installation (PEP 517/621)
        run: |
          pip install -e .
          annas-ferry --help
