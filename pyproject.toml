[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annas-archive-ferry"
version = "1.1.0"
description = "Agent skill and CLI for searching Anna's Archive and verifying local downloads"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ATP24" }
]
keywords = [
    "annas-archive",
    "shadow-library",
    "book-search",
    "pdf-downloader",
    "agent-skill",
    "ddddocr",
    "antigravity-skill"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities"
]
dependencies = [
    "requests>=2.28.0",
    "playwright>=1.40.0",
    "ddddocr>=1.4.7",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/ATP24/annas-archive-ferry"
Repository = "https://github.com/ATP24/annas-archive-ferry.git"
Issues = "https://github.com/ATP24/annas-archive-ferry/issues"

[project.scripts]
annas-ferry = "annas_archive_ferry.engine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["annas_archive_ferry*"]
